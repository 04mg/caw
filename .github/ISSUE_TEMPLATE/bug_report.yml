name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Which AI agent were you using?
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - GitHub Copilot
        - OpenCode
        - Antigravity
        - Pi
        - N/A
  - type: input
    id: version
    attributes:
      label: Caw Version
      description: "Output of `caw --version` or the git commit."
      placeholder: e.g. v1.2.3 or commit hash
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Windows
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version used to access the UI.
      placeholder: e.g. Chrome 125, Firefox 128
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or relevant log output.
    validations:
      required: false
